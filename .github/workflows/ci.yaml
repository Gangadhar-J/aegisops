name: AegisOps Production CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-validate:
    name: Lint Code & YAML Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff yamllint

      - name: Lint Python Codebase
        run: |
          ruff check agents/ apps/ mcp-servers/ chaos/ operator/ --ignore E501,F401,F841 || true

      - name: Validate Kubernetes YAML Manifests
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}, document-start: disable}}" k8s/

  test-suite:
    name: Multi-Agent & Guardrail Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest anyio httpx

      - name: Run Pytest Suite
        env:
          PYTHONPATH: "."
          AEGISOPS_ENV: "dev"
        run: |
          python -m pytest agents/tests/ -v --tb=short

  container-build:
    name: Build & Verify Production Images
    runs-on: ubuntu-latest
    needs: [test-suite]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Operator Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.operator
          push: false
          tags: aegisops-operator:test

      - name: Build IDP Portal Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.portal
          push: false
          tags: aegisops-portal:test

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisops-operator
  namespace: aegisops-system
  labels:
    app: aegisops-operator
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegisops-operator
  template:
    metadata:
      labels:
        app: aegisops-operator
    spec:
      serviceAccountName: aegisops-agent-sa
      containers:
        - name: operator
          # Replace with your registry image after: docker build -f Dockerfile.operator -t <registry>/aegisops-operator:latest .
          image: aegisops-operator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AEGISOPS_ENV
              value: "production"
            - name: PYTHONPATH
              value: "/app"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisops-idp-portal
  namespace: aegisops-system
  labels:
    app: aegisops-idp-portal
    app.kubernetes.io/component: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegisops-idp-portal
  template:
    metadata:
      labels:
        app: aegisops-idp-portal
    spec:
      serviceAccountName: aegisops-agent-sa
      containers:
        - name: idp-portal
          # Replace with your registry image after: docker build -f Dockerfile.portal -t <registry>/aegisops-portal:latest .
          image: aegisops-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          env:
            - name: AEGISOPS_ENV
              value: "production"
            - name: AEGISOPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aegisops-secrets
                  key: api-key
                  optional: true
            - name: AEGISOPS_DATA_DIR
              value: "/data/aegisops"
            - name: PYTHONPATH
              value: "/app"
          volumeMounts:
            - name: data-volume
              mountPath: /data/aegisops
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aegisops-idp-portal
  namespace: aegisops-system
  labels:
    app: aegisops-idp-portal
spec:
  type: ClusterIP
  ports:
    - port: 8005
      targetPort: 8005
      name: http
  selector:
    app: aegisops-idp-portal

# Production Ingress with Automated TLS Termination (cert-manager & ingress-nginx)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegisops-idp-portal-ingress
  namespace: aegisops-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
spec:
  tls:
    - hosts:
        - aegisops.internal.zeta.tech
      secretName: aegisops-portal-tls
  rules:
    - host: aegisops.internal.zeta.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aegisops-idp-portal
                port:
                  number: 8005
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-service-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit-rps: "500"
spec:
  tls:
    - hosts:
        - payment.internal.zeta.tech
      secretName: payment-service-tls
  rules:
    - host: payment.internal.zeta.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 8000

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remediationplans.aegisops.io
spec:
  group: aegisops.io
  names:
    kind: RemediationPlan
    listKind: RemediationPlanList
    plural: remediationplans
    singular: remediationplan
    shortNames: ["rem"]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["investigationRef", "actionType", "targetResource"]
              properties:
                investigationRef:
                  type: string
                actionType:
                  type: string
                  enum: ["ROLLBACK_DEPLOYMENT", "RESTART_PODS", "PATCH_RESOURCE_LIMITS", "SCALE_REPLICAS", "APPLY_GITOPS_PATCH"]
                targetResource:
                  type: string
                targetNamespace:
                  type: string
                proposedPatch:
                  type: string
                rollbackPlan:
                  type: string
                riskScore:
                  type: integer
                  minimum: 1
                  maximum: 10
                securityApprovalDetails:
                  type: string
            status:
              type: object
              properties:
                approvalStatus:
                  type: string
                  enum: ["PENDING_HITL", "APPROVED", "REJECTED", "AUTO_APPROVED"]
                executionStatus:
                  type: string
                  enum: ["NOT_STARTED", "IN_PROGRESS", "SUCCEEDED", "FAILED", "ROLLED_BACK"]
                approvedBy:
                  type: string
                approvedAt:
                  type: string
                  format: date-time
                executionOutput:
                  type: string
      subresources:
        status: {}

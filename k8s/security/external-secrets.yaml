# Enterprise Secrets Management via External Secrets Operator (ESO) & HashiCorp Vault
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.internal.zeta.tech:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "aegisops-controller"
          serviceAccountRef:
            name: aegisops-agent-sa
            namespace: aegisops-system
---
# Syncs Control Plane Secrets (API Key, GitHub PAT, ArgoCD Token)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aegisops-secrets
  namespace: aegisops-system
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aegisops-secrets
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: aegisops/control-plane
        property: api-key
    - secretKey: github-token
      remoteRef:
        key: aegisops/control-plane
        property: github-token
    - secretKey: argocd-token
      remoteRef:
        key: aegisops/control-plane
        property: argocd-token
---
# Syncs Grafana Observability Admin Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: observability
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: aegisops/observability
        property: grafana-admin-user
    - secretKey: admin-password
      remoteRef:
        key: aegisops/observability
        property: grafana-admin-password

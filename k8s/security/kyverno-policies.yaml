apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aegisops-guardrail-policies
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
              namespaces:
                - production
      validate:
        message: "CPU and memory resource limits must be explicitly set on all containers."
        pattern:
          spec:
            template:
              spec:
                containers:
                  - resources:
                      limits:
                        memory: "?*"
                        cpu: "?*"
                      requests:
                        memory: "?*"
                        cpu: "?*"

    - name: disallow-root-and-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
              namespaces:
                - production
      validate:
        message: "Containers must run as non-root, disallow privilege escalation, and drop all Linux capabilities."
        pattern:
          spec:
            template:
              spec:
                containers:
                  - securityContext:
                      allowPrivilegeEscalation: false
                      runAsNonRoot: true
                      capabilities:
                        drop:
                          - ALL

    - name: enforce-readonly-root-filesystem
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
              namespaces:
                - production
      validate:
        message: "Containers in production must use a read-only root filesystem to prevent runtime tampering."
        pattern:
          spec:
            template:
              spec:
                containers:
                  - securityContext:
                      readOnlyRootFilesystem: true
